syntax = "proto3";

package config.v1;

option go_package = "gaap-api/api/config/v1;v1";

import "base/base.proto";

service ConfigService {
  // Get supported currencies
  rpc ListCurrencies(ListCurrenciesReq) returns (ListCurrenciesRes);
  
  // Add a supported currency
  rpc AddCurrency(AddCurrencyReq) returns (AddCurrencyRes);
  
  // Remove a supported currency
  rpc DeleteCurrency(DeleteCurrencyReq) returns (DeleteCurrencyRes);
  
  // Get available themes
  rpc GetThemes(GetThemesReq) returns (GetThemesRes);
  
  // Get account type definitions
  rpc GetAccountTypes(GetAccountTypesReq) returns (GetAccountTypesRes);
  
  // Get exchange rates (reference + manual) relative to the anchor currency
  rpc GetExchangeRates(GetExchangeRatesReq) returns (GetExchangeRatesRes);
  
  // Set a manual exchange-rate override for a currency
  rpc SetExchangeRate(SetExchangeRateReq) returns (SetExchangeRateRes);
}

message ListCurrenciesReq {}

message ListCurrenciesRes {
  repeated string codes = 1;
  repeated string currencies = 2;
  base.BaseResponse base = 255;
}

message AddCurrencyReq {
  string code = 1;
}

message AddCurrencyRes {
  repeated string codes = 1;
  repeated string currencies = 2;
  base.BaseResponse base = 255;
}

message DeleteCurrencyReq {
  string code = 1;
}

message DeleteCurrencyRes {
  base.BaseResponse base = 255;
}

message GetThemesReq {}

message GetThemesRes {
  repeated base.Theme themes = 1;
  base.BaseResponse base = 255;
}

message GetAccountTypesReq {}

message GetAccountTypesRes {
  map<int32, base.AccountTypeConfig> types = 1;
  base.BaseResponse base = 255;
}

// ExchangeRate is a single anchor-relative exchange rate. The rate is serialized
// as a decimal string to preserve precision (never a float).
message ExchangeRate {
  string currency = 1;
  string rate = 2;
  string source = 3;
  string updated_at = 4;
}

message GetExchangeRatesReq {}

message GetExchangeRatesRes {
  string anchor = 1;
  repeated ExchangeRate rates = 2;
  base.BaseResponse base = 255;
}

message SetExchangeRateReq {
  string currency = 1;
  string rate = 2;
}

message SetExchangeRateRes {
  ExchangeRate rate = 1;
  base.BaseResponse base = 255;
}
