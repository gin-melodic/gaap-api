syntax = "proto3";

package transaction.v1;

option go_package = "gaap-api/api/transaction/v1;v1";

import "google/protobuf/timestamp.proto";
import "base/base.proto";

service TransactionService {
  // List transactions
  rpc ListTransactions(ListTransactionsReq) returns (ListTransactionsRes);
  
  // Create a new transaction
  rpc CreateTransaction(CreateTransactionReq) returns (CreateTransactionRes);
  
  // Get transaction details
  rpc GetTransaction(GetTransactionReq) returns (GetTransactionRes);
  
  // Update transaction
  rpc UpdateTransaction(UpdateTransactionReq) returns (UpdateTransactionRes);
  
  // Delete transaction
  rpc DeleteTransaction(DeleteTransactionReq) returns (DeleteTransactionRes);
}

message Transaction {
  string id = 1;
  // ISO 8601 Date string
  string date = 2;
  string from = 3;
  string to = 4;
  
  // Replaced float64 with Money
  base.Money amount = 5;
  
  string note = 6;
  // Type: INCOME, EXPENSE, TRANSFER
  base.TransactionType type = 7;
  
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message TransactionInput {
  string date = 1;
  string from = 2;
  string to = 3;
  
  // Replaced float64 with Money
  base.Money amount = 4;
  
  string note = 5;
  base.TransactionType type = 6;
}

message TransactionQuery {
  int32 page = 1;
  int32 limit = 2;
  string start_date = 3;
  string end_date = 4;
  string account_id = 5;
  base.TransactionType type = 6;
  string sort_by = 7;
  string sort_order = 8;
}

message ListTransactionsReq {
  TransactionQuery query = 1;
}

message ListTransactionsRes {
  repeated Transaction data = 1;
  base.PaginatedResponse pagination = 2;
  base.BaseResponse base = 255;
}

message CreateTransactionReq {
  TransactionInput input = 1;
}

message CreateTransactionRes {
  Transaction transaction = 1;
  base.BaseResponse base = 255;
}

message GetTransactionReq {
  string id = 1;
}

message GetTransactionRes {
  Transaction transaction = 1;
  base.BaseResponse base = 255;
}

message UpdateTransactionReq {
  string id = 1;
  TransactionInput input = 2;
}

message UpdateTransactionRes {
  Transaction transaction = 1;
  base.BaseResponse base = 255;
}

message DeleteTransactionReq {
  string id = 1;
}

message DeleteTransactionRes {
  base.BaseResponse base = 255;
}
