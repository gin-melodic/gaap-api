name: Go CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/*'

jobs:
  check:
    name: Check Go Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install gf tool
        run: |
          wget -O gf https://github.com/gogf/gf/releases/latest/download/gf_$(go env GOOS)_$(go env GOARCH)
          chmod +x gf
          ./gf install -y
          rm ./gf

      - name: Verify Dependencies
        run: go mod tidy && git diff --exit-code
        
      - name: Run Linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          
      - name: Run Tests
        run: go test -v ./...

      - name: Build
        run: make build
