root = "."
tmp_dir = "tmp"

[build]
  cmd = "cmd /c hack\\build_dev.bat"
  bin = "tmp/main.exe"
  include_ext = ["go", "yaml", "toml", "ini", "json"]
  exclude_dir = ["tmp", "vendor", "testdata", ".git"]
  include_dir = []
  exclude_file = []
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500

[log]
  time = true
  main = true
  watcher = true
  build = true
  runner = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
